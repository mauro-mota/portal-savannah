# Disposable test database; no ports and no production volumes.
name: savannah-portfolio-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal_tests
      POSTGRES_USER: portal_tests
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generate a disposable test password}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_tests -d portal_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: disposable-test-key-not-for-production-with-more-than-fifty-characters
      POSTGRES_DB: portal_tests
      POSTGRES_USER: portal_tests
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generate a disposable test password}
      PRODUCTION: "0"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py test core.tests core.tests_quality --verbosity 1 && DJANGO_SETTINGS_MODULE=config.demo_settings python manage.py test core.tests_demo --verbosity 1"]
