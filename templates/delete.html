{% extends 'base.html' %}{% block content %}<section class="confirmation"><p class="overline">EXCLUIR REGISTRO</p><h1>Confirmar exclusão?</h1><p>“{{ item.title }}” será excluído. Essa ação não pode ser desfeita.</p><form method="post">{% csrf_token %}<div class="form-actions"><button class="button danger" type="submit">Excluir registro</button><a class="button secondary" href="{% if '/tarefas/' in request.path %}/tarefas/{% elif '/metas/' in request.path %}/metas/{% elif '/compromissos/' in request.path %}/compromissos/{% elif '/comunicados/' in request.path %}/comunicados/{% else %}/{% endif %}">Cancelar</a></div></form></section>{% endblock %}
